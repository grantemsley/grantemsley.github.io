---
layout: default
---
{%- assign topic = page.categories | first -%}
<article class="post">
  <h1>{{ page.title | escape }}</h1>
  <p class="post-meta">
    {%- if topic -%}
    <a href="{{ "/" | relative_url }}#{{ topic | slugify }}">{{ topic | escape }}</a> &middot;
    {% endif -%}
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: site.date_format }}</time>
  </p>
  {{ content }}
</article>
